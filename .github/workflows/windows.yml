name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      installer_run:
        description: "Existing run containing the ARM64 installer to retest on Windows 11 (blank builds all targets)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  core:
    if: ${{ inputs.installer_run == '' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S windows -B windows/.build/core -A x64
      - run: cmake --build windows/.build/core --config Release
      - name: Prepare native PDF printer
        shell: pwsh
        run: |
          if (!(Get-Printer -Name 'Microsoft Print to PDF' -ErrorAction SilentlyContinue)) {
            Enable-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -All -NoRestart
            if (!(Get-Printer -Name 'Microsoft Print to PDF' -ErrorAction SilentlyContinue)) {
              Add-Printer -Name 'Microsoft Print to PDF' -DriverName 'Microsoft Print To PDF' -PortName 'PORTPROMPT:'
            }
          }
      - run: ctest --test-dir windows/.build/core -C Release --output-on-failure
        env:
          SSMV_PDF_TEST_OUTPUT: ${{ github.workspace }}/dist/windows/pdf-evidence
      - name: Verify public HTTPS Markdown import
        run: ./windows/.build/core/Release/ssmv_remote_tests.exe --network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: SSMV-windows-pdf-evidence
          path: dist/windows/pdf-evidence/
          if-no-files-found: ignore
  app:
    if: ${{ inputs.installer_run == '' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build native WinUI app
        shell: pwsh
        run: ./windows/scripts/build.ps1 -Platform ${{ matrix.platform }}
      - name: Smoke-test native launch and file argument
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./windows/scripts/smoke-test.ps1 -Executable dist/windows/x64/Release/SSMV.exe
      - name: Include license and test document
        shell: pwsh
        run: |
          $output = 'dist/windows/${{ matrix.platform }}/Release'
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, windows/README.md $output
          Copy-Item Examples/Windows.md $output
      - name: Install NSIS build tool
        shell: pwsh
        run: |
          choco upgrade nsis --version=3.12 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build per-user NSIS installer
        shell: pwsh
        run: ./windows/scripts/build-installer.ps1 -Platform ${{ matrix.platform }}
      - name: Verify installer and Explorer integration
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./windows/scripts/test-installer.ps1 -Installer dist/SSMV-windows-x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: SSMV-windows-${{ matrix.platform }}-installer
          path: dist/SSMV-windows-${{ matrix.platform }}-setup.exe*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.platform == 'x64'
        with:
          name: SSMV-windows-x64-installer-evidence
          path: dist/windows/installer-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SSMV-windows-${{ matrix.platform }}-development
          path: dist/windows/${{ matrix.platform }}/Release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.platform == 'x64'
        with:
          name: SSMV-windows-smoke-evidence
          path: dist/windows/smoke/
          if-no-files-found: ignore

  windows11:
    needs: app
    if: ${{ !cancelled() }}
    runs-on: windows-11-arm
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the ARM64 installer from this run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SSMV_INSTALLER_RUN: ${{ inputs.installer_run || github.run_id }}
        run: gh run download $env:SSMV_INSTALLER_RUN --name SSMV-windows-ARM64-installer --dir dist/windows11
      - name: Verify Windows 11 native installation and reading
        shell: pwsh
        run: ./windows/scripts/test-installer.ps1 -Installer dist/windows11/SSMV-windows-ARM64-setup.exe -FullReaderSmoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: SSMV-windows11-ARM64-evidence
          path: |
            dist/windows/installer-smoke/
            dist/windows/smoke/
          if-no-files-found: ignore
